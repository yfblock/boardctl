# Board config template: copy to ~/.config/boardctl/<board-name>.toml and
# adapt as needed. All IPs use documentation example ranges (RFC 5737) —
# replace them with your real environment.
description = "Example template (copy to ~/.config/boardctl/ and adapt)"

ssh_host = ""                      # where command-mode commands run: empty = local; an ssh alias runs them remotely via ssh

[serial]
url = "socket://192.0.2.10:5000"   # serial bridge URL (e.g. ser2net/TCP passthrough); local ttyUSB0 and rfc2217:// also work
timeout = 0.2

[console]
prompt = "=>"                      # console prompt (the basis for command-end detection);
                                   # configure whatever runs on the board: U-Boot "=>", a Linux shell "#"… anything works

[uboot]
load_addr = "0x80080000"           # default load address
ip_addr = "192.0.2.50"             # the device's own IP (static)
server_ip = "192.0.2.1"            # TFTP server address
ensure_server_ip = false           # set true when the target's U-Boot environment is volatile (no saveenv): serverip is restored automatically on connect

[power]
method = "command"                 # command (default) | mijia (needs pip install 'boardctl[mijia]')
reset_delay = 3                    # seconds between power-off and power-on
on_cmd = "echo 'power on'"         # power-on command (replace with a real control command, e.g. a smart plug/relay script)
off_cmd = "echo 'power off'"
# status_cmd = "..."               # optional: query the power state

# Mijia smart socket approach (native Xiaomi cloud, credentials reuse the
# mijiaAPI CLI login state):
# [power.mijia]
# dev_name = "plug-name"           # or did = "123456"
# prop = "on"                      # on/off property name: 'on' for most sockets;
#                                  # some devices' power prop isn't 'on' — change per the device's property table

[tftp]
method = "remote"                  # remote: scp to a remote tftp server
                                   # external: a resident tftpd (e.g. tftpd-hpa) already on this host; just stage the file, no privileges
ssh_host = "tftp-server"           # ssh alias for method=remote (from ~/.ssh/config)
remote_dir = "/srv/tftp"
local_dir = "tftpboot"             # tftp root dir for method=external

[loady]
sender = ""                        # Ymodem sender; empty = autodetect (Arch: lrzsz-sb, Debian/Ubuntu: sb)

[run.hello]
desc = "Example: bare-metal program (go jump)"
mode = "uboot"                     # boot mode (default): transport the file to addr then execute cmd;
                                   # console = execute a command directly, no transport; watch = passive watching
file = "hello.bin"                 # placeholder path, replace with your firmware (relative to project root or absolute)
addr = "0x80080000"                # load address (defaults to uboot.load_addr)
# entry = "0x80080000"             # jump address (defaults to addr; specify separately when load and entry differ)
cmd = "go {addr}"                  # command template: {addr}/{entry} default to uboot.load_addr,
                                   # other variables come from this target's own keys (fdt/initrd…); omitted = load only;
                                   # for command sequences write a .scr and use cmd = "source {addr}"
method = "tftp"                    # tftp / loady
timeout = 10                       # seconds to collect output after execution
reset_before = true                # automatic power-on: off→on→wait for prompt (no dependence on the device's initial state)
after = "off"                      # finish: off = power down / reset = back to prompt / none = keep state
expect = ["BM-TEST-START"]         # output assertions (substrings); expect_re for regexes; fail_re must not hit
                                  # when all positive assertions hit, wrap up early (streaming, no waiting out timeout)
# interactive = true              # interactive mode (TTY): output streams live + stdin forwarded into the device
                                  # (keep typing commands after go/booti enters the kernel), Ctrl-\ to quit
# fail_re = ["Kernel panic", "(?i)panic"]   # must not hit: one streaming hit = negative verdict
                                              # (regexes are case-sensitive; (?i) covers both Kernel panic and Rust panicked)
# fail_linger = 2                           # seconds to keep collecting output after a fail_re hit (default 2,
                                              # lets the error stack finish before power-off; 0 = wrap up immediately)

# Example booting a Linux kernel (booti raw Image: fdt required, initrd optional):
# [run.kernel]
# file = "Image"
# cmd = "booti {addr} - {fdt}"     # with initrd: booti {addr} {initrd} {fdt}
# fdt = "0x83000000"
# initrd = "0x82000000"
# reset_before = true
# after = "off"
# expect_re = ["Starting kernel"]
# fail_re = ["panic", "ERROR:"]

# Linux shell console example (no transport, power on into the shell and
# execute directly; no address semantics):
# [run.selftest]
# mode = "console"                 # cmd required; unconfigured variables like {addr} error by name
# cmd = "./selftest.sh"            # variables come from this target's own keys (e.g. cmd = "tester {slot}")
# reset_before = true
# after = "off"
# expect = ["ALL PASS"]

# Passive-watching example (the board runs its own automatic flow: bootcmd/
# on-board scripts do the transport and execution):
# [run.autoboot]
# desc = "Example: passively watch the board's automatic boot"
# mode = "watch"                    # no transport, no commands sent (file/cmd not allowed);
#                                   # quiet power-on (no prompt-waiting Ctrl-C, nothing interrupts the board's flow),
#                                   # capture starts from the very first byte of boot output
# reset_before = true
# timeout = 30
# after = "off"
# expect = ["TEST_RUNNER_DONE"]     # assertions/finish exactly as in active mode
