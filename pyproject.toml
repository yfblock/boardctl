[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boardctl"
version = "0.4.2"
description = "开发板控制工具:一键全流程(冷启动→传输→执行→断言→收尾),插件化传输/执行/电源,板卡配置于 ~/.config/boardctl"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
mijia = ["mijiaapi>=4"]   # 电源插件 boardctl.plugins.power.mijia 需要(懒加载,未装不影响其他功能)

[project.scripts]
boardctl = "boardctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["boardctl"]

# 板卡配置唯一来源是 ~/.config/boardctl/boards(或 $BOARDCTL_BOARDS);
# boardctl/boards/ 只是随包分发的示例模板,最低优先级兜底
