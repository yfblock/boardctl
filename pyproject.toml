[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boardctl"
# The single source of the version is boardctl/__init__.py's __version__ (read dynamically by hatch)
dynamic = ["version"]
description = "Dev-board control tool: one-shot full flow (cold boot → transport → execute → assert → finish), pluggable transport/power/boot-mode, boards configured in ~/.config/boardctl"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5", "cyclopts>=4.0", "msgspec>=0.19"]

[project.optional-dependencies]
mijia = ["mijiaapi>=4"]   # needed by the power plugin boardctl.plugins.power.mijia (lazy-loaded; not installing it doesn't affect anything else)
mcp = ["mcp>=1.2"]        # MCP server: pip install 'boardctl[mcp]' → boardctl-mcp

[project.scripts]
boardctl = "boardctl.cli:main"
boardctl-mcp = "boardctl.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["boardctl"]

[tool.hatch.version]
path = "boardctl/__init__.py"


# The single source of board configs is ~/.config/boardctl (or $BOARDCTL_BOARDS);
# boardctl/boards/ is only the example template shipped with the package, a
# lowest-priority fallback
